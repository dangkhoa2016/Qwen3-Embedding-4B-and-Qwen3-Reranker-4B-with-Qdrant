[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-embedding-4b-reranker-4b-qdrant"
version = "1.0.0"
description = "Production-oriented Qwen3-Embedding-4B and Qwen3-Reranker-4B stack for Qdrant, qualified for CPU inference with a reproducible 20K-point search demo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Đăng Khoa", email = "i.am@dangkhoa.dev" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "qwen3-embedding",
  "qwen3-reranker",
  "qdrant",
  "text-embeddings",
  "reranking",
  "semantic-search",
  "vector-search",
  "information-retrieval",
  "retrieval",
  "cpu-inference",
  "gguf",
  "transformers",
  "rest-api",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "transformers>=4.51.0,<5",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<8",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/dangkhoa2016/Qwen3-Embedding-4B-and-Qwen3-Reranker-4B-with-Qdrant"
Repository = "https://github.com/dangkhoa2016/Qwen3-Embedding-4B-and-Qwen3-Reranker-4B-with-Qdrant"
Issues = "https://github.com/dangkhoa2016/Qwen3-Embedding-4B-and-Qwen3-Reranker-4B-with-Qdrant/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
