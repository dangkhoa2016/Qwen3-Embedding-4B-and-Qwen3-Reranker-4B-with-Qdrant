name: CI

on:
  push:
    branches: [main, prelaunch-repository-corrective-candidate]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply corrective identity candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'prelaunch-repository-corrective-candidate'
        run: python tools/prelaunch_corrective/apply_identity.py

      - name: Apply corrective documentation candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'prelaunch-repository-corrective-candidate'
        run: |
          python tools/prelaunch_corrective/apply_docs.py
          python tools/prelaunch_corrective/normalize_doc_language_switches.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src scripts tools tests

      - name: Validate shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts tools -type f -name '*.sh' -print0)

      - name: Validate canonical model naming
        run: python scripts/check-canonical-model-naming.py .

      - name: Validate publication-ready Kaggle notebook
        run: python scripts/validate-publication-notebook.py notebooks/qwen3_embedding_reranker_qdrant_kaggle_demo.ipynb

      - name: Run full regression suite
        env:
          PYTHONPATH: src
        run: pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply corrective identity candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'prelaunch-repository-corrective-candidate'
        run: python tools/prelaunch_corrective/apply_identity.py

      - name: Apply corrective documentation candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'prelaunch-repository-corrective-candidate'
        run: |
          python tools/prelaunch_corrective/apply_docs.py
          python tools/prelaunch_corrective/normalize_doc_language_switches.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build

      - name: Verify distribution metadata and contents
        run: python scripts/verify_distribution.py --dist-dir dist

      - name: Upload canonical tag distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: qwen3-embedding-4b-and-qwen3-reranker-4b-with-qdrant-${{ github.ref_name }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  finalize-corrective-candidate:
    name: Finalize corrective candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'prelaunch-repository-corrective-candidate'
    needs: [quality, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v7
        with:
          ref: prelaunch-repository-corrective-candidate
          fetch-depth: 0

      - name: Finalize public candidate tree
        run: python tools/prelaunch_corrective/finalize_candidate.py

      - name: Commit and push final candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(corrective): freeze verified final candidate tree"
          git push origin HEAD:prelaunch-repository-corrective-candidate
          echo "FINAL_CANDIDATE_PUSH=PASS"
