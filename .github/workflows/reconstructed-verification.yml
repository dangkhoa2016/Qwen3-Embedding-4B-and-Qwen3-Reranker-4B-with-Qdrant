name: Reconstructed v1.0.0 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reconstructed-v1-verification
  cancel-in-progress: true

jobs:
  quality:
    name: Reconstructed Quality / Python ${{ matrix.python-version }}
    if: github.event.pull_request.head.ref == 'prelaunch-history-reconstruction-executor'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout reconstructed history
        uses: actions/checkout@v7
        with:
          ref: prelaunch-reconstructed-v1.0.0
          fetch-depth: 0

      - name: Assert reconstructed head and commit count
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a0e772f4c67c6a1552e29f76dfc59bf7efc6a2cd"
          test "$(git rev-list --count HEAD)" = "18"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements-dev.txt

      - name: Validate source manifest coverage and hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          manifest = Path('MANIFEST.sha256')
          seen = set()
          for lineno, raw in enumerate(manifest.read_text(encoding='utf-8').splitlines(), 1):
              m = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              assert m, (lineno, raw)
              seen.add(m.group(2))
          tracked = set(subprocess.check_output(['git','ls-files'], text=True).splitlines()) - {'MANIFEST.sha256'}
          assert seen == tracked, (sorted(tracked-seen), sorted(seen-tracked))
          print(f'MANIFEST_STRUCTURE={len(seen)}/{len(tracked)} PASS')
          PY
          sha256sum -c MANIFEST.sha256

      - name: Validate source and publication gates
        shell: bash
        run: |
          python -m compileall -q src scripts tools tests
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts tools -type f -name '*.sh' -print0)
          python scripts/check-canonical-model-naming.py .
          python scripts/validate-publication-notebook.py notebooks/qwen3_embedding_reranker_qdrant_kaggle_demo.ipynb
          PYTHONPATH=src pytest -q

  package:
    name: Reconstructed Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstructed history
        uses: actions/checkout@v7
        with:
          ref: prelaunch-reconstructed-v1.0.0
          fetch-depth: 0

      - name: Assert reconstructed head
        run: test "$(git rev-parse HEAD)" = "a0e772f4c67c6a1552e29f76dfc59bf7efc6a2cd"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and verify canonical distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build
          python scripts/verify_distribution.py --dist-dir dist
